name: Shared attendance validation
on:
  push:
    branches: [feature/attendance-validation-v1]
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test js/tests/unit/attendance-validation.test.js
