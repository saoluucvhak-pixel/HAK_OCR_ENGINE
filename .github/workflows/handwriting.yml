name: Offline handwritten digit CNN
on:
  push:
    branches: [feature/handwritten-digits-cnn]
  pull_request:
permissions:
  contents: read
jobs:
  cnn:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test js/tests/unit/attendance-validation.test.js js/tests/unit/handwritten-digits.test.js js/tests/unit/ocr-acceptance.test.js
