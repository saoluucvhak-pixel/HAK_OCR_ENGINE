name: Offline handwritten digit CNN
on:
  push:
    branches: [feature/handwritten-digits-cnn, feature/document-review-v2]
  pull_request:
permissions:
  contents: read
jobs:
  cnn:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: HAK-OCR-ENGINE-0.2.0-${{ github.run_number }}
          path: dist/HAK_OCR_ENGINE/**
          if-no-files-found: error
          retention-days: 30
