[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hak-ocr-engine"
version = "0.1.0"
description = "Offline-first, pluggable OCR framework for HAK applications"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
paddle = ["paddleocr>=3,<4"]
paddle-structure = ["paddleocr[doc-parser]>=3,<4"]
test = ["pytest>=8"]

[project.scripts]
hak-ocr = "hak_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["hak_ocr*"]
